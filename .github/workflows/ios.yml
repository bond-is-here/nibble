name: Nibble checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nibble-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify App Store SDK requirement
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhone SDK: $sdk_version"
          test "${sdk_version%%.*}" -ge 26
      - name: Check diary, nutrition, barcode, and shared SwiftUI
        run: bash Tools/check.sh
      - name: Build for iPhone Simulator
        run: xcodebuild -project Nibble.xcodeproj -scheme Nibble -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build release for iPhone (unsigned)
        run: xcodebuild -project Nibble.xcodeproj -scheme Nibble -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
